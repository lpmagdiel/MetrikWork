<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Sin conexión — MetricWork</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      max-width: 300px;
      line-height: 1.6;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.75rem 2rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <img class="icon" src="/icons/icon-192x192.png" alt="MetricWork" />
  <h1>Sin conexión</h1>
  <p>No tienes conexión a internet. Algunas funciones pueden no estar disponibles hasta que te reconnectes.</p>
  <button onclick="window.location.reload()">Reintentar</button>
</body>
</html>
